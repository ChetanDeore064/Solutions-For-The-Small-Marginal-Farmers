<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farming Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
        }
        header {
            background: #28a745;
            color: white;
            padding: 10px 20px;
        }
        header a {
            color: white;
        }
        .container {
            padding: 20px;
        }
        .chatbot-container {
            width: min(640px, 92%);
            margin: auto;
            background: linear-gradient(160deg, #2e7d32, #8d6e63);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .chatbot-content {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
        }
        #chatbotMessages {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
            background: #fff;
        }
        input[type="text"] {
            width: min(420px, 70%);
            padding: 10px;
            margin-top: 10px;
        }
        button {
            padding: 10px 16px;
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <header>
        <h1>Farming Assistant</h1>
        <p><a href="index.html">Back to home</a></p>
    </header>
    <div class="container">
        <section class="chatbot-container">
            <div class="chatbot-content">
                <h2>Ask about your crop</h2>
                <div id="chatbotMessages">
                    <p><strong>Assistant:</strong> Ask about weather, irrigation, pests, market prices, wheat, rice, or maize.</p>
                </div>
                <input type="text" id="chatbotInput" placeholder="Ask me anything..." onkeypress="handleKeyPress(event)">
                <button type="button" onclick="sendChatMessage()">Send</button>
            </div>
        </section>
    </div>
    <script src="chatbot.js"></script>
</body>
</html>
